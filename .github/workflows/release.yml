name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Verify tag matches Cargo.toml version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "mdget-cli") | .version')
          TAG_VERSION="${TAG#v}"
          echo "Git tag version:   $TAG_VERSION"
          echo "Cargo.toml version: $CARGO_VERSION"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "ERROR: tag '$TAG' does not match Cargo.toml version '$CARGO_VERSION'"
            exit 1
          fi

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install security tools
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit,cargo-deny

      - name: Audit dependencies for known vulnerabilities
        run: cargo audit

      - name: Check licenses, advisories, bans, and sources
        run: cargo deny check

  build:
    needs: [version-check, security]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            skip_tests: true

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cross

      - name: Build release
        run: ${{ matrix.cross && 'cross' || 'cargo' }} build --release --target ${{ matrix.target }}

      - name: Run tests
        if: "!matrix.skip_tests"
        run: ${{ matrix.cross && 'cross' || 'cargo' }} test --workspace --target ${{ matrix.target }}

      - name: Verify CLI runs
        if: "!matrix.cross && !matrix.skip_tests"
        run: cargo run --release --target ${{ matrix.target }} -p mdget-cli -- --help

      # winget's validator runs the binary without arguments and fails any
      # non-zero exit.
      - name: Verify bare invocation exits 0
        if: "!matrix.cross && !matrix.skip_tests"
        run: cargo run --release --target ${{ matrix.target }} -p mdget-cli

      # Same check as ci.yml's windows-release job, on the binary that ships:
      # an env RUSTFLAGS would silently drop .cargo/config.toml's +crt-static.
      - name: No dynamic C runtime imports (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          exe="target/$TARGET/release/mdget.exe"
          if grep -a -o -i -E '[a-z0-9_.-]+\.dll' "$exe" | sort -u -f |
              grep -i -E '^(vcruntime|msvcp|api-ms-win-crt-)'; then
            echo "::error::$exe imports the dynamic MSVC C runtime"
            exit 1
          fi

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../mdget-${{ matrix.target }}.tar.gz mdget
          cd ../../..

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../mdget-${{ matrix.target }}.zip mdget.exe
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mdget-${{ matrix.target }}
          path: mdget-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" artifacts/*

  crates-io:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Verify CARGO_TOKEN is set
        env:
          CARGO_TOKEN: ${{ secrets.CARGO_TOKEN }}
        shell: bash
        run: |
          if [ -z "${CARGO_TOKEN}" ]; then
            echo "ERROR: CARGO_TOKEN secret is not set"
            exit 1
          fi

      - name: Publish mdget-core to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
        run: |
          output=$(cargo publish --package mdget-core --locked 2>&1) && exit 0
          if echo "$output" | grep -q 'already uploaded'; then
            echo "mdget-core already published, skipping."
          else
            echo "$output" >&2
            exit 1
          fi

      - name: Publish mdget-cli to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
        run: |
          set -euo pipefail
          max_attempts=10
          delay=15
          for attempt in $(seq 1 "$max_attempts"); do
            echo "Publishing mdget-cli (attempt $attempt/$max_attempts)..."
            if output=$(cargo publish --package mdget-cli --locked 2>&1); then
              echo "$output"
              echo "mdget-cli published successfully."
              exit 0
            fi
            echo "$output"
            if echo "$output" | grep -qiE 'failed to select a version|no matching package named|depends on'; then
              if [ "$attempt" -eq "$max_attempts" ]; then
                echo "ERROR: giving up after $max_attempts attempts" >&2
                exit 1
              fi
              echo "Index not yet updated, waiting ${delay}s..."
              sleep "$delay"
              delay=$((delay * 2))
            else
              echo "ERROR: cargo publish failed with a non-index error" >&2
              exit 1
            fi
          done
