# Configuration for cargo-deny — https://embarkstudios.github.io/cargo-deny/
#
# Run locally: cargo deny check
# Runs automatically in the release workflow as a quality gate.

[advisories]
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    # webpki-root-certs (via reqwest 0.13's rustls-platform-verifier) ships
    # the Mozilla CCADB root list under a Community Data License.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

# MPL-2.0 (file-level copyleft; used unmodified, source on crates.io):
# Servo's CSS selector stack, which dom_smoothie uses through dom_query.
# Allowed for exactly these crates, not added to the allow-list above.
[[licenses.exceptions]]
crate = "cssparser"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "cssparser-macros"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "dtoa-short"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "selectors"
allow = ["MPL-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
